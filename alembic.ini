[alembic]
script_location = backend/ums_smart_revenue/db/alembic
prepend_sys_path = backend
# path_separator resolves to os.pathsep (";" Windows dev, ":" Linux CI) — harmless
# ONLY while prepend_sys_path stays a single path; revisit before adding a second.
path_separator = os
timezone = UTC
sqlalchemy.url = postgresql+psycopg://ums:ums@localhost:5432/ums_smart_revenue

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
