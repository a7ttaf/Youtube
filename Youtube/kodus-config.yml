version: '1.2'
summary:
  generatePRSummary: true
  customInstructions: |
    Summaries must call out revenue, authorization, audit, export, and frontend
    design-system impact when those areas are touched. Keep summaries factual
    and separate implementation changes from validation evidence.
  behaviourForExistingDescription: concatenate
ignorePaths:
  - .env
  - .env.*
  - frontend/bun.lock
  - uv.lock
  - '**/*.woff2'
  - '**/*.png'
  - '**/*.jpg'
  - '**/*.jpeg'
  - '**/*.gif'
  - '**/*.svg'
  - '**/*.map'
baseBranches:
  - main
reviewOptions:
  security: true
  code_style: true
  kody_rules: true
  refactoring: true
  error_handling: true
  maintainability: true
  potential_issues: true
  documentation_and_comments: true
  performance_and_optimization: true
  business_logic: true
suggestionControl:
  groupingMode: full
  limitationType: pr
  maxSuggestions: 9
  severityLevelFilter: medium
ignoredTitleKeywords:
  - WIP
  - draft
automatedReviewActive: true
pullRequestApprovalActive: false
isRequestChangesActive: false
llmGeneratedMemoriesRequireApproval: true
