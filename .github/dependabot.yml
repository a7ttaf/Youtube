version: 2
updates:
  # uv, not pip: this project is uv-managed and carries a uv.lock. The pip
  # ecosystem edits pyproject.toml only, leaving uv.lock stale — and because
  # the Dockerfile installs from the lock, that silently shipped images running
  # the OLD versions while pyproject claimed the new ones. The uv ecosystem
  # understands pyproject.toml + uv.lock together and updates both.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      patch-updates:
        update-types: ["patch"]
      minor-updates:
        update-types: ["minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "build"
      include: "scope"
