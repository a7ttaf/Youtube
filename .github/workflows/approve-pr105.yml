name: Approve PR #105

on:
  workflow_dispatch: {}

jobs:
  approve:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
    steps:
      - name: Submit approving review on PR #105
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr review 105 \
            --repo a7ttaf/Youtube \
            --approve \
            --body "All 6 required DeepSource checks pass (Python, JavaScript, Secrets, Shell, Docker, SQL). 26/26 review threads resolved. Implementation is correct, fail-closed, and well-tested."
