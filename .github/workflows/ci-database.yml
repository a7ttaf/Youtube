name: ci-database

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-database-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Postgres migrations and authz
    runs-on: ubuntu-latest
    # This context also runs the canonical blocking repository gate below;
    # allow its database, frontend, security, formatting, and shell self-tests
    # to complete without inheriting the old subset-only timeout.
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ums
          POSTGRES_DB: test_ums
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_ums"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UMS_TEST_DATABASE_URL: postgresql+psycopg://postgres:ums@127.0.0.1:55432/test_ums
      UV_LOCKED: "1"
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        # astral-sh/setup-uv@v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          version: "0.11.8"

      - name: "Install Python (3.14 band, newest per platform)"
        run: uv python install 3.14

      - name: Sync locked toolchain
        run: uv sync --locked --extra dev --extra test --extra lint

      - name: Verify authoritative pytest partition
        run: uv run python scripts/ci_test_partition.py --check

      - name: Alembic upgrade head
        env:
          # Application/unit tests must not inherit this setting: make verify
          # intentionally exercises their default isolated storage contract.
          UMS_DATABASE_URL: postgresql+psycopg://postgres:ums@127.0.0.1:55432/test_ums
        run: uv run alembic upgrade head

      - name: Database and real-Postgres pytest lane
        run: uv run python scripts/ci_test_partition.py --lane database

      - name: Set up Bun for the repository quality gate
        # oven-sh/setup-bun@v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Provision pinned Bats
        env:
          BATS_VERSION: "v1.13.0"
          BATS_COMMIT: "3bca150ec86275d6d9d5a4fd7d48ab8b6c6f3d87"
        run: |
          FORCE=1 bash ci/scripts/install-bats.sh
          echo "$GITHUB_WORKSPACE/.ci-gate/bats/bin" >> "$GITHUB_PATH"

      - name: Validate every GitHub Actions workflow
        # rhysd/actionlint@v1.7.7, pinned by container digest.
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          -w /repo
          rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Canonical blocking repository gate
        env:
          CI_GATE_PUSH_OLD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_GATE_PUSH_NEW_SHA: ${{ github.sha }}
        run: |
          # Pull-request merge commits are checked out detached. The local-only
          # branch gives git-safety a name without changing the commit or tree.
          if [ -z "$(git branch --show-current)" ]; then
            git switch --create "ci-required-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          make verify

      # The bats suites write per-test failures to junit XML and the runner's
      # stderr file, neither of which reaches the console log — a red
      # tests-shell lane was unattributable from the run log alone.
      - name: Surface bats failures
        if: ${{ failure() }}
        run: |
          echo '=== shell.stderr ==='
          cat ci/reports/junit/shell.stderr 2>/dev/null || true
          echo '=== failing cases from shell.xml ==='
          grep -B1 -A6 '<failure' ci/reports/junit/shell.xml 2>/dev/null || true

      - name: Full formatting contract
        if: ${{ always() }}
        run: uv run --locked bash ci/checks/format.sh

      - name: Supply-chain lockfile integrity
        if: ${{ always() }}
        run: bash ci/checks/supply-chain.sh
