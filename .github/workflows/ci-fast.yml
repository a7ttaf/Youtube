name: ci-fast

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "1"
    # The authoritative fast lane measured 25m46s on the managed Windows
    # validation host before setup, lint, mypy, and frontend checks. Sixty
    # minutes keeps the timeout useful without turning normal variance into a
    # false failure.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        # astral-sh/setup-uv@v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          version: "0.11.8"

      - name: "Install Python (3.14 band, newest per platform)"
        run: uv python install 3.14

      - name: Sync locked toolchain
        run: uv sync --locked --extra dev --extra test --extra lint

      - name: Ruff
        run: uv run ruff check backend tests scripts

      - name: Mypy (backend package)
        run: uv run mypy backend/ums_smart_revenue --ignore-missing-imports

      - name: Enforce pytest no-skip policy
        env:
          PYTHONPATH: backend
        run: uv run python -m ums_smart_revenue.devtools.pytest_policy_gate

      - name: Verify authoritative pytest partition
        run: uv run python scripts/ci_test_partition.py --check

      - name: Pytest (no-database lane)
        run: uv run python scripts/ci_test_partition.py --lane fast

      - name: Set up Bun
        # oven-sh/setup-bun@v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Frontend test-layout contract
        env:
          CI_GATE_MODE: ship
        run: bash ci/checks/test-layout.sh

      - name: Committed-range whitespace check
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA..$HEAD_SHA"
