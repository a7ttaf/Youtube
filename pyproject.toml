[project]
name = "ums-smart-revenue"
version = "0.1.0"
description = "UMS Smart Revenue Control Center backend foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.136.1",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.46.0",
    "SQLAlchemy==2.0.49",
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "neo4j==6.2.0",
    "celery==5.6.3",
    "redis==7.4.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
