[project]
name = "ums-smart-revenue"
version = "0.1.0"
description = "UMS Smart Revenue Control Center backend foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.136.1",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.46.0",
    "SQLAlchemy==2.0.49",
    "alembic==1.18.4",
    "psycopg[binary]==3.3.4",
    "celery==5.6.3",
    "redis==7.4.0",
    "openpyxl==3.1.5",
    "reportlab==4.5.1",
    "python-pptx==1.0.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "httpx==0.28.1",
    "pypdf==6.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 120
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
