[project]
name = "ums-smart-revenue"
version = "0.1.0"
description = "UMS Smart Revenue Control Center backend foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.136.3",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.48.0",
    "SQLAlchemy==2.0.50",
    "alembic==1.18.4",
    "psycopg[binary]==3.3.4",
    "httpx==0.28.1",
    "celery==5.6.3",
    "redis==8.0.0",
    "openpyxl==3.1.5",
    "reportlab==4.5.1",
    "python-pptx==1.0.2",
    "google-cloud-secret-manager==2.28.0",
    "google-cloud-storage==3.10.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "httpx==0.28.1",
    "pypdf==6.12.1",
]
lint = [
    "mypy==2.1.0",
    "ruff==0.15.14",
]
dev = [
    "httpx==0.28.1",
    "mypy==2.1.0",
    "pypdf==6.12.1",
    "pytest==9.0.3",
    "ruff==0.15.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 120
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
