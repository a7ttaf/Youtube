[project]
name = "ums-smart-revenue"
version = "0.1.0"
description = "UMS Smart Revenue Control Center backend foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.136.3",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.49.0",
    "SQLAlchemy==2.0.50",
    "alembic==1.18.4",
    "psycopg[binary]==3.3.4",
    "httpx==0.28.1",
    "celery==5.6.3",
    "redis==8.0.0",
    "openpyxl==3.1.5",
    "reportlab==4.5.1",
    "python-pptx==1.0.2",
    "google-cloud-secret-manager==2.29.0",
    "google-cloud-storage==3.12.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "httpx==0.28.1",
    "pypdf==6.13.2",
]
lint = [
    "mypy==2.1.0",
    "ruff==0.15.17",
]
dev = [
    "httpx==0.28.1",
    "mypy==2.1.0",
    "pypdf==6.13.2",
    "pytest==9.0.3",
    "ruff==0.15.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
src = ["backend"]
# Ruff 0.15+ removes parentheses around except-tuples on Python 3.14+ even
# though the two forms are semantically equivalent; keep the explicit tuple
# form on files where the parenthesized multi-type except was the shipping
# style in main and where DeepSource flagged the bare-comma form (FLK-E999:
# DeepSource's parser does not accept PEP 758 unparenthesized except groups).
[tool.ruff.per-file-target-version]
"backend/ums_smart_revenue/api/connectors.py" = "py38"
"backend/ums_smart_revenue/api/exports.py" = "py38"
"backend/ums_smart_revenue/auth/sql_audit_sink.py" = "py38"
"backend/ums_smart_revenue/connectors/runs/normalization.py" = "py38"
"backend/ums_smart_revenue/finance/explanations.py" = "py38"

[tool.ruff.format]
# Force LF so `ruff format` does not rewrite files with CRLF on Windows
# checkouts; the repo is LF-standard (core.autocrlf is false and the only
# CRLF file is pinned to eol=lf in .gitattributes). Keeps `git diff --check`
# clean regardless of the developer's platform.
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
