[project]
name = "ums-smart-revenue"
version = "0.1.0"
description = "UMS Smart Revenue Control Center backend foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.140.3",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.51.0",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "httpx==0.28.1",
    "celery==5.6.3",
    "redis==8.0.1",
    "openpyxl==3.1.5",
    "reportlab==5.0.0",
    "python-pptx==1.0.2",
    "google-cloud-secret-manager==2.30.0",
    "google-cloud-storage==3.13.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "pypdf==6.14.2",
]
lint = [
    "mypy==2.3.0",
    "ruff==0.16.1",
]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.0",
    "pypdf==6.14.2",
    "pytest==9.1.1",
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
src = ["backend"]
# Pin the formatter/linter grammar to 3.13 even though the runtime requires
# 3.14. Python 3.14 made parentheses optional for multi-type `except (A, B)`
# handlers; with an inferred py314 target, `ruff format` rewrites them to the
# bare `except A, B` spelling, which the DeepSource analyzer and any sub-3.14
# parser reject as a SyntaxError (FLK-E999). Targeting py313 keeps ruff emitting
# the parenthesized form — valid on 3.14 too — so the formatter, the linter, and
# the static analyzers stay coherent. The py313 linter also flags the bare form
# as invalid-syntax, guarding against future regressions.
target-version = "py313"
# Ruff 0.16 formats Python code blocks inside Markdown by default. The
# `format-python` gate (ci/checks/format.sh) runs `ruff format --check .` from
# the repo root and .ci-gateignore does not exclude Docs/, so that default
# would newly fail 32 historical planning documents under Docs/superpowers/.
# Those are dated point-in-time records and rewriting them would falsify the
# history they exist to preserve, so keep Markdown out of scope — this
# restores exactly the pre-0.16 file set.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
